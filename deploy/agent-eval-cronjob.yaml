# Nightly evaluation of the agent's LLM decision path (Simulate + Optimize):
# replays aiops/scenarios.json - incl. poisoned search results - through
# guard -> LLM -> catalog -> judge -> pre-check against a fake cluster, scores
# every prompt variant, logs JSON (Loki) and pushes a summary to ntfy "aiops".
# Run now: kubectl -n aiops-demo create job --from=cronjob/aiops-eval aiops-eval-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-eval
  namespace: aiops-demo
spec:
  suspend: true   # v2 runs its own nightly evaluation
  schedule: "30 3 * * *"
  timeZone: Asia/Taipei
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: aiops-eval
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: eval
              image: aiops-agent:local
              imagePullPolicy: Never
              command: ["python", "-m", "aiops.simulate",
                        "--variants", "default,evidence-first",
                        "--notify", "http://ntfy.travel.svc.cluster.local/aiops"]
              env:
                - name: AIOPS_OLLAMA_ENDPOINT
                  value: "http://ollama.aiops-demo.svc.cluster.local:11434"
                - name: AIOPS_OLLAMA_MODEL
                  value: "qwen3.5:4b"
                - name: AIOPS_LLM_TIMEOUT
                  value: "120"
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 300m, memory: 192Mi}
