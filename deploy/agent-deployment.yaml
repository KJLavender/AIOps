# The AI Ops agent running as a resident Deployment, self-monitoring aiops-demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops-demo
  labels:
    app: aiops-agent
spec:
  # Superseded by the multi-agent AIOps v2 (github.com/KJLavender/AIOps-v2).
  # Set back to 1 (and scale v2 down) to run this single-agent version again.
  replicas: 0
  # One writer at a time on the RWO Knowledge Base volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      serviceAccountName: aiops-agent
      priorityClassName: homelab-platform
      # Service links would inject *_PORT=tcp://... env vars that can clash
      # with our AIOPS_* config (e.g. a Service named aiops-dashboard).
      enableServiceLinks: false
      # The dashboard must be a real listening socket on the node: WSL mirrored
      # networking forwards Windows localhost only to listening sockets, not to
      # kube-proxy NodePort rules. Cluster DNS is kept for the ollama Service.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Seed the persistent KB from the image on first start only.
      initContainers:
        - name: seed-kb
          image: aiops-agent:local
          imagePullPolicy: Never
          command: ["sh", "-c", "[ -f /kb/knowledge_base.jsonl ] || cp /app/data/knowledge_base.jsonl /kb/"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: kb
              mountPath: /kb
      containers:
        - name: agent
          image: aiops-agent:local
          imagePullPolicy: Never
          # Live web dashboard on the node's port 30080
          # (Windows: http://localhost:30080).
          args: ["--dashboard"]
          ports:
            - name: dashboard
              containerPort: 30080
          env:
            - name: AIOPS_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: AIOPS_DASHBOARD_PORT
              value: "30080"
            - name: AIOPS_ALL_NAMESPACES
              value: "false"
            - name: AIOPS_NAMESPACES
              value: "aiops-demo,travel,github"
            - name: AIOPS_POLL_INTERVAL
              value: "20"
            - name: AIOPS_STABILITY
              value: "15"
            - name: AIOPS_VALIDATION_TIMEOUT
              value: "120"
            - name: AIOPS_VALIDATION_POLL
              value: "8"
            - name: AIOPS_KB_PATH
              value: "/kb/knowledge_base.jsonl"
            # Operator-approved values: only these get auto-fixed.
            - name: AIOPS_IMAGE_FALLBACKS
              value: "nginx=nginx:1.27-alpine,busybox=busybox:1.36"
            - name: AIOPS_ENV_DEFAULTS
              value: "DB_HOST=db.aiops-demo.svc.cluster.local"
            # LLM fallback (set true and point at Ollama to enable)
            - name: AIOPS_LLM_ENABLED
              value: "true"
            - name: AIOPS_OLLAMA_ENDPOINT
              value: "http://ollama:11434"
            - name: AIOPS_OLLAMA_MODEL
              value: "qwen3.5:4b"
            - name: AIOPS_LLM_TIMEOUT
              value: "120"
            - name: AIOPS_LLM_MIN_CONFIDENCE
              value: "0.6"
            # Unknown failures: search the web (Exa, same backend as the
            # agent-reach skill), let the LLM pick a fix from the bounded
            # catalog in aiops/actions.py; failed fixes are rolled back.
            - name: AIOPS_WEB_SEARCH
              value: "true"
            - name: AIOPS_LLM_AUTO_FIX
              value: "true"
          volumeMounts:
            - name: kb
              mountPath: /kb
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: kb
          persistentVolumeClaim:
            claimName: aiops-kb
