# Case 7: CreateContainerConfigError — env references a ConfigMap that doesn't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case7-missing-configmap
  namespace: aiops-demo
  labels:
    app: case7-missing-configmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case7-missing-configmap
  template:
    metadata:
      labels:
        app: case7-missing-configmap
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: mode
