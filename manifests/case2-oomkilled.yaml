# Case 2: OOMKilled — 64Mi limit while the app allocates a large list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case2-oomkilled
  namespace: aiops-demo
  labels:
    app: case2-oomkilled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case2-oomkilled
  template:
    metadata:
      labels:
        app: case2-oomkilled
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command:
            - python
            - -c
            - "a = bytearray(150 * 1024 * 1024); import time; time.sleep(3600)"
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 64Mi
