# Case 5: Pending — requests more memory than any node has (unschedulable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case5-pending
  namespace: aiops-demo
  labels:
    app: case5-pending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case5-pending
  template:
    metadata:
      labels:
        app: case5-pending
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            # Explicit limit: the namespace LimitRange default (128Mi) would be
            # below the request and the pod would be rejected instead of Pending.
            requests:
              memory: 256Gi
            limits:
              memory: 256Gi
