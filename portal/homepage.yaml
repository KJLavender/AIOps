# Homepage (gethomepage.dev): one portal for everything on the cluster.
# http://home.100-115-153-20.sslip.io:8000 (PC and phone), http://homelab:8000 (phone on
# Tailscale), http://localhost:8000 (this PC).
#
# Lives in the monitoring namespace so the Grafana widget can read the
# grafana-admin Secret. Each service tile shows its pods' status/CPU/memory
# (kubernetes integration) plus a live widget.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: monitoring
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: homepage
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: monitoring
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: HomeLab
    language: zh-Hant
    theme: dark
    color: slate
    headerStyle: clean
    hideVersion: true
    # Default (column) layout: three groups side by side on a PC, stacked on a
    # phone. "style: row" with fixed columns overflowed narrow screens.
    layout:
      機票優惠:
      GitHub 每日:
      AIOps 自我修復:
      監控:
  services.yaml: |
    - 機票優惠:
        - 機票追蹤:
            icon: mdi-airplane
            href: http://flights.100-115-153-20.sslip.io:8000
            description: 打字就能改追蹤航線，每 3 小時自動檢查
            namespace: travel
            app: flight-watcher
            podSelector: app=flight-watcher
            widget:
              type: customapi
              url: http://flight-watcher.travel.svc.cluster.local:8080/api/state
              refreshInterval: 60000
              display: dynamic-list
              mappings:
                items: watches
                name: route
                label: summary
                target: http://flights.100-115-153-20.sslip.io:8000
        - ntfy 通知:
            icon: ntfy.png
            href: http://ntfy.100-115-153-20.sslip.io:8000/flights
            description: 降價推播，也可以在這裡打字下指令
            namespace: travel
            app: ntfy
            podSelector: app=ntfy
    - GitHub 每日:
        - 今日新星 Top 10:
            icon: github.png
            href: http://trending.100-115-153-20.sslip.io:8000
            description: 過去 24 小時新建立、星數最高的 repo（每天 09:00）
            namespace: github
            app: github-daily
            podSelector: app=github-daily
            widget:
              type: customapi
              url: http://github-daily.github.svc.cluster.local:8080/api/state
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: items
                name: rank_name
                label: stars_text
                limit: 10
                target: "{url}"
        - 研究推薦:
            icon: mdi-compass-outline
            href: http://picks.100-115-153-20.sslip.io:8000
            description: 依你的研究主題每天推薦 5 個（可打字改主題）
            namespace: github
            app: repo-picks
            podSelector: app=repo-picks
            widget:
              type: customapi
              url: http://repo-picks.github.svc.cluster.local:8080/api/state
              refreshInterval: 300000
              display: dynamic-list
              mappings:
                items: items
                name: rank_name
                label: stars_text
                target: "{url}"
    - AIOps 自我修復:
        - AIOps v2（多 Agent）:
            icon: mdi-robot-outline
            href: http://aiops.100-115-153-20.sslip.io:8000
            description: monitor → diagnose → repair → validate，各自一個 pod，用 Kubernetes 資源交接
            namespace: aiops-system
            app: aiops-v2
            podSelector: app.kubernetes.io/part-of=aiops-v2
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: 處理中的事故
                  query: max(aiops_incidents_open) or vector(0)
                - label: 自動修好（24h）
                  query: sum(increase(aiops_remediations_total{phase="validated"}[24h])) or vector(0)
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: 學會的修法
                  query: max(aiops_lessons) or vector(0)
        - AIOps 儀表板（Grafana）:
            icon: grafana.png
            href: http://grafana.100-115-153-20.sslip.io:8000/d/aiops-v2
            description: 事故與修復結果、LLM 決策品質、四個 Agent 的健康狀態與 log
    - 監控:
        - Grafana:
            icon: grafana.png
            href: http://grafana.100-115-153-20.sslip.io:8000
            description: 所有儀表板（Kubernetes / AIOps / 機票）
            namespace: monitoring
            app: grafana
            podSelector: app.kubernetes.io/name=grafana
            widget:
              type: grafana
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
              fields: ["dashboards", "datasources"]
        - Prometheus:
            icon: prometheus.png
            href: http://grafana.100-115-153-20.sslip.io:8000/d/efa86fd1d0c121a26444b636a3f509a8
            description: 叢集與各服務的 CPU / 記憶體用量
            namespace: monitoring
            app: prometheus
            podSelector: app.kubernetes.io/name=prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              # Two blocks fit a phone screen; total targets is just up + down.
              fields: ["targets_up", "targets_down"]
        - Loki:
            icon: loki.png
            href: http://grafana.100-115-153-20.sslip.io:8000/d/logs
            description: 選 namespace / 服務、輸入關鍵字查 log（保留 7 天）
            namespace: monitoring
            app: loki
            podSelector: app.kubernetes.io/name in (loki, alloy)
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s
        nodes:
          show: false
    - datetime:
        text_size: md
        locale: zh-TW
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
  bookmarks.yaml: |
    - 專案:
        - GitHub:
            - icon: github.png
              href: https://github.com/KJLavender/AIOps
  custom.css: ""
  # Links point at the Tailscale names (they work on the phone). This PC can't
  # reach its own Tailscale address, so when the page is opened via
  # *.localhost, rewrite the links to the *.localhost names instead.
  custom.js: |
    (function () {
      if (!/(^|\.)localhost$/.test(location.hostname)) return;
      var from = ".100-115-153-20.sslip.io";
      function fix() {
        document.querySelectorAll('a[href*="' + from + '"]').forEach(function (a) {
          a.href = a.href.replace(from, ".localhost");
        });
      }
      new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
      fix();
    })();
  docker.yaml: ""
  # v2.4 copies every skeleton file it doesn't find; /app/config is read-only.
  proxmox.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: monitoring
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
      annotations:
        # Bump to roll the pod after editing the ConfigMap.
        config-revision: "9"
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      enableServiceLinks: false
      priorityClassName: homelab-service
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The first entry is required for the kubelet probe.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,localhost:8000,home.localhost:8000,home.100-115-153-20.sslip.io:8000,homelab:8000,100.115.153.20:8000"
            - name: HOMEPAGE_VAR_GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: HOMEPAGE_VAR_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
          # Ready gate keeps Traefik from routing to it before Next.js is up.
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /app/config/custom.js, subPath: custom.js}
            - {name: config, mountPath: /app/config/custom.css, subPath: custom.css}
            - {name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml}
            - {name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml}
            - {name: config, mountPath: /app/config/proxmox.yaml, subPath: proxmox.yaml}
            - {name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml}
            - {name: config, mountPath: /app/config/services.yaml, subPath: services.yaml}
            - {name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml}
            - {name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml}
            - {name: logs, mountPath: /app/config/logs}
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: monitoring
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: home.100-115-153-20.sslip.io
      http: &paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
    - host: home.localhost
      http: *paths
    # No host: anything else on :8000 (http://localhost:8000, http://homelab:8000).
    - http: *paths
