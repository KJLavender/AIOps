# Flight deal watcher: checks Google Flights every 3h for each watched route,
# takes natural-language commands from the web UI or the ntfy "flights" topic.
# Web UI: http://flights.100-115-153-20.sslip.io:8000
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flight-watcher-data
  namespace: travel
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-watcher
  namespace: travel
  labels:
    app: flight-watcher
spec:
  replicas: 1
  strategy:
    type: Recreate   # single SQLite writer
  selector:
    matchLabels:
      app: flight-watcher
  template:
    metadata:
      labels:
        app: flight-watcher
    spec:
      enableServiceLinks: false
      priorityClassName: homelab-service
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: flight-watcher:local
          imagePullPolicy: Never
          env:
            - name: CHECK_INTERVAL_MINUTES
              value: "180"
            - name: WINDOW_START_DAYS
              value: "7"
            - name: WINDOW_END_DAYS
              value: "90"
            - name: DEFAULT_ORIGIN
              value: "台北"
            - name: NTFY_URL
              value: "http://ntfy.travel.svc.cluster.local"
            - name: NTFY_TOPIC
              value: "flights"
            # Optional: also push to a public topic for notifications away
            # from home, e.g. "https://ntfy.sh/<long-random-topic>".
            - name: EXTRA_NOTIFY_URLS
              value: ""
            - name: OLLAMA_ENDPOINT
              value: "http://ollama.aiops-demo.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:7b"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flight-watcher-data
---
apiVersion: v1
kind: Service
metadata:
  name: flight-watcher
  namespace: travel
  labels:
    app: flight-watcher
spec:
  selector:
    app: flight-watcher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-watcher
  namespace: travel
spec:
  ingressClassName: traefik
  rules:
    - host: flights.100-115-153-20.sslip.io   # via Tailscale (phone) or the Windows hosts file (PC)
      http: &paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flight-watcher
                port:
                  name: http
    - host: flights.localhost
      http: *paths
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flight-watcher
  namespace: travel
spec:
  selector:
    matchLabels:
      app: flight-watcher
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
